name: Thumbnail backfill normalize

on:
  push:
    branches:
      - perf/backfill-thumbnails

permissions:
  contents: write

concurrency:
  group: thumbnail-backfill-normalize
  cancel-in-progress: true

jobs:
  normalize:
    runs-on: [self-hosted, linux, x64]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/backfill-thumbnails
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Normalize and test
        run: |
          go mod tidy
          gofmt -w cmd/privatechat/main.go cmd/privatechat/backfill_command_test.go internal/thumbnailbackfill/*.go
          go test ./cmd/privatechat ./internal/thumbnailbackfill -count=1
          go vet ./cmd/privatechat ./internal/thumbnailbackfill
      - name: Commit mechanical updates
        working-directory: .
        run: |
          git diff --check
          git add backend/go.mod backend/go.sum backend/cmd/privatechat backend/internal/thumbnailbackfill
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: normalize thumbnail backfill changes"
          git push origin HEAD:perf/backfill-thumbnails
