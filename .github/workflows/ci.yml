name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: [self-hosted, linux, x64, cursor]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Download dependencies
        run: go mod download
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...

  migrations:
    runs-on: [self-hosted, linux, x64, cursor]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: private_chat
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres -d private_chat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: private_chat
      POSTGRES_SSLMODE: disable
      TIME_ZONE: UTC
    steps:
      - uses: actions/checkout@v4
      - name: Resolve PostgreSQL service port
        run: |
          echo "POSTGRES_PORT=${{ job.services.postgres.ports['5432'] }}" >> "$GITHUB_ENV"
          echo "POSTGRES_CONTAINER_ID=${{ job.services.postgres.id }}" >> "$GITHUB_ENV"
      - name: Configure PostgreSQL client wrappers
        run: |
          mkdir -p "$RUNNER_TEMP/postgres-client"
          cat > "$RUNNER_TEMP/postgres-client/psql" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          args=("$@")
          input_file=""
          for ((i = 0; i < ${#args[@]}; i++)); do
            if [[ "${args[$i]}" == "-f" && $((i + 1)) -lt ${#args[@]} ]]; then
              input_file="${args[$((i + 1))]}"
              args[$((i + 1))]="-"
              break
            fi
          done

          if [[ -n "$input_file" ]]; then
            exec docker exec -i \
              -e PGPASSWORD="$PGPASSWORD" \
              "$POSTGRES_CONTAINER_ID" \
              psql "${args[@]}" < "$input_file"
          fi

          exec docker exec -i \
            -e PGPASSWORD="$PGPASSWORD" \
            "$POSTGRES_CONTAINER_ID" \
            psql "${args[@]}"
          SCRIPT
          cat > "$RUNNER_TEMP/postgres-client/createdb" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker exec -i \
            -e PGPASSWORD="$PGPASSWORD" \
            "$POSTGRES_CONTAINER_ID" \
            createdb "$@"
          SCRIPT
          chmod +x "$RUNNER_TEMP/postgres-client/psql" "$RUNNER_TEMP/postgres-client/createdb"
          echo "$RUNNER_TEMP/postgres-client" >> "$GITHUB_PATH"
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Download dependencies
        working-directory: backend
        run: go mod download
      - name: Build backend migration command
        working-directory: backend
        run: go build -o ../private-chat-backend ./cmd/privatechat
      - name: Apply legacy schema fixture
        run: psql -h 127.0.0.1 -U postgres -d private_chat -v ON_ERROR_STOP=1 -f migrations/test_legacy_schema.sql
      - name: Apply managed migrations
        run: ./private-chat-backend migrate
      - name: Verify managed migrations
        run: |
          psql -h 127.0.0.1 -U postgres -d private_chat -v ON_ERROR_STOP=1 -f migrations/test_file_security_assertions.sql
          test "$(psql -h 127.0.0.1 -U postgres -d private_chat -Atc "SELECT version || ':' || dirty FROM schema_migrations")" = "202609030002:false"
          test "$(psql -h 127.0.0.1 -U postgres -d private_chat -Atc "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema = current_schema() AND table_name = 't_message' AND column_name = 'client_msg_id' AND character_maximum_length = 64")" = "1"
          test "$(psql -h 127.0.0.1 -U postgres -d private_chat -Atc "SELECT COUNT(*) FROM pg_indexes WHERE schemaname = current_schema() AND tablename = 't_message' AND indexname = 'uk_message_sender_client_msg_id'")" = "1"
          test "$(psql -h 127.0.0.1 -U postgres -d private_chat -Atc "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema = current_schema() AND table_name = 't_user' AND column_name = 'last_seen_at' AND data_type = 'timestamp with time zone'")" = "1"
          test "$(psql -h 127.0.0.1 -U postgres -d private_chat -Atc "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema = current_schema() AND table_name = 't_user' AND column_name = 'city' AND character_maximum_length = 100")" = "1"
          test "$(psql -h 127.0.0.1 -U postgres -d private_chat -Atc "SELECT COUNT(*) FROM pg_indexes WHERE schemaname = current_schema() AND tablename = 't_message' AND indexname = 'idx_message_conversation_cursor'")" = "1"
          test "$(psql -h 127.0.0.1 -U postgres -d private_chat -Atc "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema = current_schema() AND table_name = 't_message' AND column_name = 'reply_to_message_id'")" = "1"
          test "$(psql -h 127.0.0.1 -U postgres -d private_chat -Atc "SELECT COUNT(*) FROM pg_indexes WHERE schemaname = current_schema() AND tablename = 't_message' AND indexname = 'idx_message_reply_to'")" = "1"
          test "$(psql -h 127.0.0.1 -U postgres -d private_chat -Atc "SELECT COUNT(*) FROM pg_indexes WHERE schemaname = current_schema() AND tablename = 't_message' AND indexname = 'idx_message_unread_receiver_conversation' AND indexdef LIKE '%WHERE (is_read = 0)%'")" = "1"
      - name: Verify planned online migration
        run: |
          test "$(psql -h 127.0.0.1 -U postgres -d private_chat -Atc "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema = current_schema() AND table_name = 't_user' AND column_name IN ('availability_start_at', 'availability_end_at', 'availability_note')")" = "3"
      - name: Test message persistence against PostgreSQL
        working-directory: backend
        env:
          RUN_POSTGRES_TESTS: "1"
        run: go test ./internal/app -run 'TestSaveMessage(Idempotency|WithReply)' -count=1
      - name: Re-run managed migrations idempotently
        run: ./private-chat-backend migrate
      - name: Verify current init.sql can be adopted
        run: |
          createdb -h 127.0.0.1 -U postgres initialized_chat
          psql -h 127.0.0.1 -U postgres -d initialized_chat -v ON_ERROR_STOP=1 -f init.sql
          POSTGRES_DB=initialized_chat ./private-chat-backend migrate
          test "$(psql -h 127.0.0.1 -U postgres -d initialized_chat -Atc "SELECT version || ':' || dirty FROM schema_migrations")" = "202609030002:false"
          test "$(psql -h 127.0.0.1 -U postgres -d initialized_chat -Atc "SELECT COUNT(*) FROM information_schema.table_constraints tc JOIN information_schema.key_column_usage kcu ON tc.constraint_name = kcu.constraint_name AND tc.constraint_schema = kcu.constraint_schema JOIN information_schema.constraint_column_usage ccu ON tc.constraint_name = ccu.constraint_name AND tc.constraint_schema = ccu.constraint_schema WHERE tc.constraint_type = 'FOREIGN KEY' AND tc.table_schema = current_schema() AND tc.table_name = 't_message' AND kcu.column_name = 'file_id' AND ccu.table_schema = current_schema() AND ccu.table_name = 't_file' AND ccu.column_name = 'id'")" = "1"
          test "$(psql -h 127.0.0.1 -U postgres -d initialized_chat -Atc "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema = current_schema() AND table_name = 't_message' AND column_name = 'client_msg_id' AND character_maximum_length = 64")" = "1"
          test "$(psql -h 127.0.0.1 -U postgres -d initialized_chat -Atc "SELECT COUNT(*) FROM pg_indexes WHERE schemaname = current_schema() AND tablename = 't_message' AND indexname = 'uk_message_sender_client_msg_id'")" = "1"
          test "$(psql -h 127.0.0.1 -U postgres -d initialized_chat -Atc "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema = current_schema() AND table_name = 't_user' AND column_name = 'last_seen_at' AND data_type = 'timestamp with time zone'")" = "1"
          test "$(psql -h 127.0.0.1 -U postgres -d initialized_chat -Atc "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema = current_schema() AND table_name = 't_user' AND column_name = 'city' AND character_maximum_length = 100")" = "1"
          test "$(psql -h 127.0.0.1 -U postgres -d initialized_chat -Atc "SELECT COUNT(*) FROM pg_indexes WHERE schemaname = current_schema() AND tablename = 't_message' AND indexname = 'idx_message_conversation_cursor'")" = "1"
          test "$(psql -h 127.0.0.1 -U postgres -d initialized_chat -Atc "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema = current_schema() AND table_name = 't_message' AND column_name = 'reply_to_message_id'")" = "1"
          test "$(psql -h 127.0.0.1 -U postgres -d initialized_chat -Atc "SELECT COUNT(*) FROM pg_indexes WHERE schemaname = current_schema() AND tablename = 't_message' AND indexname = 'idx_message_reply_to'")" = "1"
          test "$(psql -h 127.0.0.1 -U postgres -d initialized_chat -Atc "SELECT COUNT(*) FROM pg_indexes WHERE schemaname = current_schema() AND tablename = 't_message' AND indexname = 'idx_message_unread_receiver_conversation' AND indexdef LIKE '%WHERE (is_read = 0)%'")" = "1"
      - name: Smoke-test unread message index rollback SQL
        run: |
          psql -h 127.0.0.1 -U postgres -d private_chat -v ON_ERROR_STOP=1 -f backend/internal/migration/sql/202609030002_unread_message_index.down.sql
          test "$(psql -h 127.0.0.1 -U postgres -d private_chat -Atc "SELECT COUNT(*) FROM pg_indexes WHERE schemaname = current_schema() AND tablename = 't_message' AND indexname = 'idx_message_unread_receiver_conversation'")" = "0"
      - name: Smoke-test user city rollback SQL
        run: |
          psql -h 127.0.0.1 -U postgres -d private_chat -v ON_ERROR_STOP=1 -f backend/internal/migration/sql/202609030001_user_city.down.sql
          test "$(psql -h 127.0.0.1 -U postgres -d private_chat -Atc "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema = current_schema() AND table_name = 't_user' AND column_name = 'city'")" = "0"
      - name: Smoke-test message reply rollback SQL
        run: |
          psql -h 127.0.0.1 -U postgres -d private_chat -v ON_ERROR_STOP=1 -f backend/internal/migration/sql/202608280001_message_reply.down.sql
          test "$(psql -h 127.0.0.1 -U postgres -d private_chat -Atc "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema = current_schema() AND table_name = 't_message' AND column_name = 'reply_to_message_id'")" = "0"
      - name: Smoke-test planned online rollback SQL
        run: |
          psql -h 127.0.0.1 -U postgres -d private_chat -v ON_ERROR_STOP=1 -f backend/internal/migration/sql/202608270002_availability.down.sql
          test "$(psql -h 127.0.0.1 -U postgres -d private_chat -Atc "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema = current_schema() AND table_name = 't_user' AND column_name IN ('availability_start_at', 'availability_end_at', 'availability_note')")" = "0"
      - name: Smoke-test message cursor index rollback SQL
        run: |
          psql -h 127.0.0.1 -U postgres -d private_chat -v ON_ERROR_STOP=1 -f backend/internal/migration/sql/202608270001_message_cursor_index.down.sql
          test "$(psql -h 127.0.0.1 -U postgres -d private_chat -Atc "SELECT COUNT(*) FROM pg_indexes WHERE schemaname = current_schema() AND tablename = 't_message' AND indexname = 'idx_message_conversation_cursor'")" = "0"
      - name: Smoke-test last seen rollback SQL
        run: |
          psql -h 127.0.0.1 -U postgres -d private_chat -v ON_ERROR_STOP=1 -f backend/internal/migration/sql/202608100002_last_seen.down.sql
          test "$(psql -h 127.0.0.1 -U postgres -d private_chat -Atc "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema = current_schema() AND table_name = 't_user' AND column_name = 'last_seen_at'")" = "0"
      - name: Smoke-test client message id rollback SQL
        run: |
          psql -h 127.0.0.1 -U postgres -d private_chat -v ON_ERROR_STOP=1 -f backend/internal/migration/sql/202608100001_client_msg_id.down.sql
          test "$(psql -h 127.0.0.1 -U postgres -d private_chat -Atc "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema = current_schema() AND table_name = 't_message' AND column_name = 'client_msg_id'")" = "0"
          test "$(psql -h 127.0.0.1 -U postgres -d private_chat -Atc "SELECT COUNT(*) FROM pg_indexes WHERE schemaname = current_schema() AND tablename = 't_message' AND indexname = 'uk_message_sender_client_msg_id'")" = "0"
      - name: Smoke-test file security rollback SQL
        run: psql -h 127.0.0.1 -U postgres -d private_chat -v ON_ERROR_STOP=1 -f backend/internal/migration/sql/202608070001_file_security.down.sql
      - name: Verify file security rollback
        run: psql -h 127.0.0.1 -U postgres -d private_chat -v ON_ERROR_STOP=1 -f migrations/test_file_security_down_assertions.sql

  compose:
    runs-on: [self-hosted, linux, x64, cursor]
    env:
      POSTGRES_HOST: postgres.example
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: private_chat
      REDIS_PASSWORD: redis-password
      R2_ENDPOINT: https://example.r2.cloudflarestorage.com
      R2_ACCESS_KEY: access-key
      R2_SECRET_KEY: secret-key
      R2_BUCKET: bucket
      JWT_SECRET: this-is-a-ci-only-secret-with-32-characters
      WEBRTC_STUN_URL: stun:turn.example.com:3478
      WEBRTC_TURN_URLS: turn:turn.example.com:3478?transport=udp
      WEBRTC_TURN_SECRET: ci-only-turn-shared-secret
      WEBRTC_TURN_REALM: turn.example.com
      WEBRTC_TURN_EXTERNAL_IP: 203.0.113.10
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: |
          docker compose config --quiet
          docker compose --profile voice config --quiet

  frontend:
    runs-on: [self-hosted, linux, x64, cursor]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test last seen formatter
        run: |
          rm -rf /tmp/private-chat-time-test
          ./node_modules/.bin/tsc src/utils/time.ts --target ES2022 --module commonjs --moduleResolution node --outDir /tmp/private-chat-time-test
          TZ=Asia/Shanghai node <<'NODE'
          const assert = require('node:assert/strict')
          const { formatLastSeen } = require('/tmp/private-chat-time-test/time.js')
          const now = new Date('2026-08-10T07:00:00Z')
          assert.equal(formatLastSeen(null, now), '离线')
          assert.equal(formatLastSeen('not-a-date', now), '离线')
          assert.equal(formatLastSeen('2026-08-10T06:32:00Z', now), '最后上线 今天 14:32')
          assert.equal(formatLastSeen('2026-08-09T14:18:00Z', now), '最后上线 昨天 22:18')
          assert.equal(formatLastSeen('2026-08-08T11:30:00Z', now), '最后上线 08-08 19:30')
          assert.equal(formatLastSeen('2025-12-31T01:15:00Z', now), '最后上线 2025-12-31 09:15')
          NODE
      - name: Test chat flows
        run: |
          npm run test -- \
            src/api/imageUpload.test.ts \
            src/composables/useAttachmentIngress.test.ts \
            src/utils/uploadQueue.test.ts \
            src/stores/chat.test.ts \
            src/stores/chat.ws-observer.test.ts \
            src/components/MessageStatusIndicator.test.ts \
            src/utils/messageReply.test.ts \
            src/composables/useWebRtcCall.test.ts \
            src/composables/useIncomingCallAlert.test.ts \
            src/stores/call.test.ts \
            src/components/VoiceCallOverlay.test.ts \
            src/views/VoiceCallIntegration.test.ts \
            src/views/MobileChat.ios.test.ts
      - name: Type-check and build
        run: npm run build
