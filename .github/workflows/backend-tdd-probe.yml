name: Backend TDD probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  image-loading-red:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - name: Run image loading regression tests
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/src"
          -w /src/backend
          golang:1.23
          go test ./internal/app
          -run 'Test(ImageUploadPresignsOriginalAndThumbnail|FileContentHandlerUsesPrivateFiveMinuteCache|RoutesExposeProtectedThumbnailEndpoint)'
          -count=1
