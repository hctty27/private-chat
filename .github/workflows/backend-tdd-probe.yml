name: Image loading TDD probe

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: image-loading-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-image:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Run image loading regression tests
        run: >-
          go test ./internal/app
          -run 'Test(ImageUploadPresignsOriginalAndThumbnail|FileContentHandlerUsesPrivateFiveMinuteCache|RoutesExposeProtectedThumbnailEndpoint|FileThumbnailHandler)'
          -count=1

  frontend-image:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm install --no-save --legacy-peer-deps vitest@4.1.10 @vue/test-utils@2.4.11 jsdom@27.4.0
      - name: Run image loading regression tests
        run: npm exec vitest run src/api/imageUpload.test.ts src/views/ChatPage.image-loading.test.ts
