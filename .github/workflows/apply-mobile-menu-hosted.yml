name: Apply mobile menu hosted

on:
  push:
    branches:
      - feat/mobile-double-tap-menu

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-double-tap-menu
          fetch-depth: 0
      - run: python3 scripts/apply_mobile_menu.py
      - name: Commit source edits
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src/views/MobileChat.vue frontend/src/views/MobileChat.ios.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat: open mobile message menu on double tap"
          git push origin HEAD:feat/mobile-double-tap-menu
