name: Thumbnail backfill go.sum cleanup

on:
  push:
    branches:
      - perf/backfill-thumbnails

permissions:
  contents: write

concurrency:
  group: thumbnail-backfill-gosum-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: [self-hosted, linux, x64]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/backfill-thumbnails
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Minimize go.sum and verify
        run: |
          git show origin/master:backend/go.sum > go.sum
          go mod download golang.org/x/image@v0.25.0
          go test ./cmd/privatechat ./internal/thumbnailbackfill -count=1
          go vet ./cmd/privatechat ./internal/thumbnailbackfill
      - name: Commit minimized checksum diff
        working-directory: .
        run: |
          git diff --check
          git add backend/go.sum
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: minimize thumbnail dependency checksums"
          git push origin HEAD:perf/backfill-thumbnails
