name: Refresh TanStack Virtual lock

on:
  push:
    branches:
      - fix/ios-chat-scroll-model
    paths:
      - .github/workflows/refresh-virtual-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ios-chat-scroll-model
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Upgrade TanStack Virtual
        working-directory: frontend
        run: npm install --save-exact @tanstack/vue-virtual@3.13.35
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-virtual-lock.yml
          git add frontend/package.json frontend/package-lock.json
          git commit -m "chore: upgrade TanStack Virtual for iOS"
          git push origin HEAD:fix/ios-chat-scroll-model
