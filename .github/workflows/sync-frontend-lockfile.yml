name: Sync frontend lockfile

on:
  push:
    branches:
      - chore/first-batch-hardening-20260827

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, linux, x64, cursor]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Regenerate package lock
        run: npm install --package-lock-only --legacy-peer-deps
      - name: Commit package lock
        working-directory: .
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "chore: sync frontend lockfile"
          git push
