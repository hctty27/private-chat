name: Thumbnail backfill probe

on:
  push:
    branches:
      - perf/backfill-thumbnails

permissions:
  contents: write

concurrency:
  group: thumbnail-backfill-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-focused:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/backfill-thumbnails
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Normalize module and formatting
        run: |
          go mod tidy
          gofmt -w cmd/privatechat/main.go cmd/privatechat/backfill_command_test.go internal/thumbnailbackfill/*.go
      - name: Run focused tests
        run: go test ./cmd/privatechat ./internal/thumbnailbackfill -count=1
      - name: Verify diff
        run: git diff --check
        working-directory: .
      - name: Commit mechanical updates
        working-directory: .
        run: |
          git add backend/go.mod backend/go.sum backend/cmd/privatechat backend/internal/thumbnailbackfill
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: normalize thumbnail backfill changes"
          git push origin HEAD:perf/backfill-thumbnails
