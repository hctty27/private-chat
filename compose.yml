services:
  # 前端容器：Nginx + Vue静态文件
  frontend:
    build: ./frontend
    container_name: private-chat-frontend
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    networks:
      - my-network

  # 一次性数据库迁移：只连接 PostgreSQL，成功退出后 backend 才启动。
  migrate:
    build: ./backend
    container_name: private-chat-migrate
    command: ["migrate"]
    restart: "no"
    networks:
      - my-network
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - TIME_ZONE=${TIME_ZONE:-Asia/Shanghai}
      - POSTGRES_HOST=${POSTGRES_HOST:?missing POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:?missing POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?missing POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:?missing POSTGRES_DB}
      - POSTGRES_SSLMODE=${POSTGRES_SSLMODE:-require}

  # Go 后端
  backend:
    build: ./backend
    container_name: private-chat-backend
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - my-network
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - TIME_ZONE=${TIME_ZONE:-Asia/Shanghai}
      - LISTEN_ADDR=${LISTEN_ADDR:-:8080}
      - GIN_MODE=${GIN_MODE:-release}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      - WS_ALLOWED_ORIGINS=${WS_ALLOWED_ORIGINS:-}
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-true}
      - POSTGRES_HOST=${POSTGRES_HOST:?missing POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:?missing POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?missing POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:?missing POSTGRES_DB}
      - POSTGRES_SSLMODE=${POSTGRES_SSLMODE:-require}
      - REDIS_ADDR=${REDIS_ADDR:-redis:6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?missing REDIS_PASSWORD}
      - R2_ENDPOINT=${R2_ENDPOINT:?missing R2_ENDPOINT}
      - R2_ACCESS_KEY=${R2_ACCESS_KEY:?missing R2_ACCESS_KEY}
      - R2_SECRET_KEY=${R2_SECRET_KEY:?missing R2_SECRET_KEY}
      - R2_BUCKET=${R2_BUCKET:?missing R2_BUCKET}
      - R2_OBJECT_PREFIX=${R2_OBJECT_PREFIX:-}
      - JWT_SECRET=${JWT_SECRET:?missing JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-1h}
      - JWT_ABSOLUTE_EXPIRATION=${JWT_ABSOLUTE_EXPIRATION:-720h}
      - WEBRTC_ENABLED=${WEBRTC_ENABLED:-false}
      - WEBRTC_ICE_POLICY=${WEBRTC_ICE_POLICY:-all}
      - WEBRTC_TURN_PROVIDER=${WEBRTC_TURN_PROVIDER:-cloudflare}
      - CLOUDFLARE_TURN_KEY_ID=${CLOUDFLARE_TURN_KEY_ID:-}
      - CLOUDFLARE_TURN_API_TOKEN=${CLOUDFLARE_TURN_API_TOKEN:-}
      - WEBRTC_STUN_URL=${WEBRTC_STUN_URL:-}
      - WEBRTC_TURN_URLS=${WEBRTC_TURN_URLS:-}
      - WEBRTC_TURN_SECRET=${WEBRTC_TURN_SECRET:-}
      - WEBRTC_TURN_CREDENTIAL_TTL=${WEBRTC_TURN_CREDENTIAL_TTL:-10m}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ready || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s


  # 可选语音通话 TURN 服务：仅在 --profile voice 时启动。
  coturn:
    image: coturn/coturn:4.17.2-r0
    container_name: private-chat-coturn
    profiles: ["voice"]
    restart: unless-stopped
    networks:
      - my-network
    command:
      - --log-file=stdout
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${WEBRTC_TURN_SECRET:-}
      - --realm=${WEBRTC_TURN_REALM:-}
      - --external-ip=${WEBRTC_TURN_EXTERNAL_IP:-}
      - --min-port=${WEBRTC_TURN_MIN_PORT:-49160}
      - --max-port=${WEBRTC_TURN_MAX_PORT:-49200}
      - --no-cli
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "${WEBRTC_TURN_MIN_PORT:-49160}-${WEBRTC_TURN_MAX_PORT:-49200}:${WEBRTC_TURN_MIN_PORT:-49160}-${WEBRTC_TURN_MAX_PORT:-49200}/udp"

networks:
  my-network:
    external: true
